# Documentation lint (#96). The documents in this tree are part of the product:
# an install guide that has drifted is a defect, and a pointer to a file that was
# renamed is how a plan quietly stops being a plan. This is the check that
# refuses the machine-decidable half of that.
#
# Four legs run on every branch and every pull request, because all four are
# deterministic and depend on nothing outside this repository. A fifth leg,
# external links, runs on a schedule instead, and the reason is at that job.
#
# Three of the four judge a document's shape and the fourth judges its words.
# The spelling leg is the one that came last, because it needs a project
# dictionary and the dictionary has to hold the terms from `docs/vocabulary.md`,
# which #5 owed and has since landed.
#
# WHAT THIS DELIBERATELY DOES NOT CHECK, so a green run is not read as more than
# it is:
#
#   Prose quality, grammar and readability. Not machine decidable, and a check
#   that pretends otherwise produces noise a contributor learns to ignore.
#
#   Whether a document is TRUE. A guide can pass every leg here and describe
#   software that does something else. That is what a review is for.
#
#   Whether the dictionary holds every term `docs/vocabulary.md` fixes. The
#   dictionary is curated and no leg derives the term list from that document.
#   Deriving it means matching the shape of an English definition sentence, and
#   a definition rewritten into another shape would drop its term from the
#   requirement with nothing saying so, which is a check that fails open. What
#   the dictionary carries today is a decision recorded in #96 rather than
#   something a run establishes.
#
#   Whether a hyphenated coinage is a word. The speller judges `un-retires` as
#   `un` and `retires`, so the half that is not a word on its own is what a
#   run reports, and the dictionary carries `un` for that reason. An entry
#   like that admits the bare fragment everywhere in the tree, which is the
#   price of judging the compound at all with a speller that does not know it.
#
#   Heading anchors. A link to `docs/foo.md#some-heading` is checked as far as
#   `docs/foo.md` and the fragment is ignored, so a renamed heading is not
#   caught. Adding it means deriving GitHub's own anchor slugs, which is a
#   guess at somebody else's renderer.
#
#   Link text. Whether "see the federation document" points at the federation
#   document is a judgement about meaning.
#
#   Anything that is not a tracked `*.md` file. The workflow files, the DCO and
#   the attributes file carry prose in comments and no leg here reads it.
#
#   Line endings and encoding. Those are text-hygiene's, they are already
#   refused there, and this workflow reads the checkout rather than the index
#   because of it.
name: doc-hygiene

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # The external link leg only. See the reason at that job.
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

# Read-only: every leg reads the checkout and nothing writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: Documentation formatting, paths and internal links
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Refuse a tracked document that is not formatted for readable diffs
        run: |
          set -euo pipefail
          # The convention this enforces is the one the tree already follows:
          # prose is hard wrapped, so a one-word edit produces a one-line diff
          # instead of reflowing a paragraph and hiding the change inside it.
          #
          # Measured before this leg landed, over every tracked *.md outside
          # fenced and indented code blocks: 85 lines at 81 columns, one at 82,
          # nothing longer. 81 is therefore the tree's own limit rather than a
          # number chosen here, and the single line at 82 was rewrapped in the
          # change that added this leg.
          #
          # Code blocks are exempt in both spellings. A pasted command and its
          # output must stay byte-exact, and wrapping one would make it a
          # command nobody can run.
          files=$(git ls-files '*.md')
          if [ -z "$files" ]; then
            echo "::error::No tracked document was examined. Failing closed rather than reporting a clean tree."
            exit 1
          fi
          count=$(printf '%s\n' "$files" | wc -l)
          fail=0
          # A file whose last byte is not a newline, or which ends in a blank
          # line, produces a diff on the last line of the next change that
          # touches it.
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then
              echo "FAIL  $f is empty"
              fail=1
              continue
            fi
            if [ "$(tail -c 1 "$f" | wc -l)" -ne 1 ]; then
              echo "FAIL  $f does not end with a newline"
              fail=1
            fi
            if [ -z "$(tail -n 1 "$f")" ]; then
              echo "FAIL  $f ends with a blank line"
              fail=1
            fi
          done <<< "$files"
          if ! printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 awk '
            FNR == 1 { infence = 0; prev = "SOF" }
            {
              line = $0
              if (line ~ /^```/) { infence = !infence; prev = line; next }
              incode = (infence || line ~ /^    /)
              if (line ~ /[ \t]+$/) { print "FAIL  " FILENAME ":" FNR " has trailing whitespace"; bad = 1 }
              if (line ~ /\t/)      { print "FAIL  " FILENAME ":" FNR " contains a tab"; bad = 1 }
              if (line == "" && prev == "") { print "FAIL  " FILENAME ":" FNR " is the second of two blank lines"; bad = 1 }
              if (!incode && length(line) > 81) {
                print "FAIL  " FILENAME ":" FNR " is " length(line) " columns, over the 81 this tree wraps at"
                bad = 1
              }
              lines++
              prev = line
            }
            END {
              printf "Examined %d line(s) for formatting.\n", lines
              if (lines == 0) { print "FAIL  no line was examined"; bad = 1 }
              exit bad ? 1 : 0
            }'; then
            fail=1
          fi
          echo "Examined $count tracked document(s) for formatting."
          if [ "$fail" -ne 0 ]; then
            echo "::error::Tracked document(s) above are not formatted the way this tree stores documents. Wrap prose at 81 columns, drop trailing whitespace and tabs, and end the file with one newline."
            exit 1
          fi
          echo "Every tracked document is formatted for readable diffs."

      - name: Refuse a document naming a path that does not exist
        # Always report, so a formatting failure above cannot hide a dangling
        # path here and send somebody round the loop twice.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # This is the leg that earns the workflow. This plan depends on
          # documents pointing at each other, at the workflows and at the
          # attributes file, and a pointer to something renamed is invisible
          # until somebody follows it.
          #
          # A path-like token is one written in backticks that holds a slash or
          # ends in a known extension. It resolves relative to the directory of
          # the document naming it first, then from the repository root, which
          # is how the documents under docs/ already name their siblings. A
          # directory counts as resolved. Tokens inside code blocks are skipped:
          # a pasted transcript names paths in other repositories and this tree
          # cannot resolve those.
          files=$(git ls-files '*.md')
          if [ -z "$files" ]; then
            echo "::error::No tracked document was examined. Failing closed rather than reporting a clean tree."
            exit 1
          fi
          tokens=$(printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 awk '
            FNR == 1 { infence = 0 }
            /^```/ { infence = !infence; next }
            {
              if (infence || $0 ~ /^    /) next
              line = $0
              while (match(line, /`[^`]+`/)) {
                tok = substr(line, RSTART + 1, RLENGTH - 2)
                if (tok ~ /^[A-Za-z0-9_.][A-Za-z0-9_.\/-]*$/ && (tok ~ /\// || tok ~ /\.(md|yml|yaml|json|toml|go|txt|sum|mod)$/))
                  print FILENAME "\t" tok
                line = substr(line, RSTART + RLENGTH)
              }
            }')
          fail=0
          examined=0
          if [ -n "$tokens" ]; then
            while IFS=$'\t' read -r src tok; do
              examined=$((examined + 1))
              dir=$(dirname "$src")
              if [ -e "$dir/$tok" ] || [ -e "$tok" ]; then
                continue
              fi
              echo "FAIL  $src names $tok, which does not exist"
              fail=1
            done <<< "$tokens"
          fi
          echo "Examined $examined path reference(s) in $(printf '%s\n' "$files" | wc -l) tracked document(s)."
          if [ "$fail" -ne 0 ]; then
            echo "::error::Document(s) above name a path that does not exist. Name no path you do not intend to resolve."
            exit 1
          fi
          echo "Every path a document names resolves."

      - name: Refuse an internal link that goes nowhere
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Markdown link targets that are not http(s) and not a bare fragment.
          # The fragment on a local target is stripped and not checked; the
          # comment at the top of this file says so and says why.
          files=$(git ls-files '*.md')
          if [ -z "$files" ]; then
            echo "::error::No tracked document was examined. Failing closed rather than reporting a clean tree."
            exit 1
          fi
          links=$(printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 awk '
            FNR == 1 { infence = 0 }
            /^```/ { infence = !infence; next }
            {
              if (infence) next
              line = $0
              while (match(line, /\]\([^)]*\)/)) {
                t = substr(line, RSTART + 2, RLENGTH - 3)
                if (t !~ /^https?:/ && t !~ /^mailto:/ && t !~ /^#/ && t != "")
                  print FILENAME "\t" t
                line = substr(line, RSTART + RLENGTH)
              }
            }')
          fail=0
          examined=0
          if [ -n "$links" ]; then
            while IFS=$'\t' read -r src target; do
              examined=$((examined + 1))
              path=${target%%#*}
              if [ -z "$path" ]; then
                continue
              fi
              dir=$(dirname "$src")
              if [ -e "$dir/$path" ] || [ -e "$path" ]; then
                continue
              fi
              echo "FAIL  $src links to $target, which does not exist"
              fail=1
            done <<< "$links"
          fi
          echo "Examined $examined internal link(s) in $(printf '%s\n' "$files" | wc -l) tracked document(s)."
          if [ "$fail" -ne 0 ]; then
            echo "::error::Link(s) above go nowhere. A link in a document is a promise that the thing at the other end exists."
            exit 1
          fi
          echo "Every internal link resolves."

  spelling:
    name: Documentation spelling
    # The fourth thing #96 asks for, and the last one it stayed open on. The
    # other three legs judge a document's shape; this one judges its words, so
    # that the terms `docs/vocabulary.md` fixes are spelled one way wherever
    # they appear, and so that a typo in an operator's guide is caught by the
    # gate rather than by the operator.
    #
    # It is a job of its own rather than a fourth step beside the others,
    # because a check-run name is what a ruleset matches and the name of the job
    # above says what that job judges. Adding a fourth kind of judgement under a
    # name listing three would make the name wrong.
    #
    # WHAT THIS DELIBERATELY DOES NOT DO:
    #
    #   It does not judge grammar, style or whether a sentence is true. Those
    #   are the same judgements the job above disclaims and for the same reason.
    #
    #   It does not read anything that is not a tracked `*.md` file, and inside
    #   one it reads prose only. Fenced and indented code blocks, inline code
    #   spans and link targets are removed before a word is judged, because a
    #   pasted command is not prose and a dictionary that had to carry every
    #   identifier in it would stop being a dictionary.
    #
    #   It does not say WHERE in a line the word is, only which line first
    #   carries it. A word is reported once per document at its first
    #   occurrence, because a term spelled wrong throughout would otherwise
    #   produce one report per sentence.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Refuse a project dictionary that cannot be read as a list
        run: |
          set -euo pipefail
          # The dictionary is a plain word list, one word per line, because that
          # is the format the speller below reads. The format carries no comment
          # syntax, so nothing in the file can say why a word is in it, and the
          # only defence a file like that has against becoming a junk drawer is
          # that it stays sorted, unique and free of anything that is not a word.
          # That is what this step refuses, and it runs before the speller so a
          # malformed dictionary is reported as a malformed dictionary rather
          # than as a document full of unknown words.
          dict=.github/dictionary.txt
          if [ ! -s "$dict" ]; then
            echo "::error::$dict is missing or empty. Failing closed rather than judging every word against the general word list alone."
            exit 1
          fi

          fail=0
          if grep -n '^[[:space:]]*$' "$dict" > /dev/null; then
            grep -n '^[[:space:]]*$' "$dict" | while IFS=: read -r n _; do
              echo "FAIL  $dict:$n is blank"
            done
            fail=1
          fi
          if grep -n '[[:space:]]' "$dict" > /dev/null; then
            grep -n '[[:space:]]' "$dict" | while IFS=: read -r n rest; do
              echo "FAIL  $dict:$n carries whitespace: $rest"
            done
            fail=1
          fi
          # LC_ALL=C so the order is the byte order and not the runner's locale.
          # A dictionary sorted under one collation and checked under another
          # would red for a reason nobody changed.
          if ! LC_ALL=C sort -c -u "$dict" 2> sortcheck.txt; then
            sed 's/^/FAIL  /' sortcheck.txt
            echo "FAIL  $dict is not sorted, or carries the same word twice"
            fail=1
          fi

          entries=$(grep -c '' "$dict")
          echo "Examined $entries entry(s) in $dict."
          if [ "$fail" -ne 0 ]; then
            echo "::error::The project dictionary above is not a sorted list of one word per line. Sort it with LC_ALL=C sort -u and remove anything that is not a word."
            exit 1
          fi
          echo "The project dictionary reads as a sorted list of $entries word(s)."

      - name: Refuse a word that is in no dictionary this project carries
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The word list is British English, because that is what this tree
          # writes: `normalised` and `summarised` are in it today and a check
          # spelling them wrong would be a check nobody could pass.
          #
          # WHAT PINS THIS IS THE RUNNER IMAGE AND NOT A VERSION, and that is
          # this leg's cost rather than a detail. The other tools in this gate
          # are pinned, a Go tool by its version and an action by its commit, and
          # no such pin exists for a system word list. A runner image that ships
          # a different one can move this verdict without anything in this tree
          # changing. The version it actually used is printed below so a red run
          # can be told from a moved word list, and #99 is where the pinning
          # position for the whole gate is argued.
          #
          # That unpinned word list is also why the project dictionary carries
          # the terms from `docs/vocabulary.md` whether or not the general list
          # already knows them. A term this project fixes the meaning of should
          # not have its verdict decided by somebody else's package, and a word
          # the general list knows today it can stop knowing tomorrow.
          sudo apt-get update -qq
          sudo apt-get install -y -qq hunspell hunspell-en-gb
          echo "speller  $(hunspell -vv | head -n 1)"
          echo "wordlist $(dpkg-query -W -f='${Package} ${Version}' hunspell-en-gb)"

          files=$(git ls-files '*.md')
          if [ -z "$files" ]; then
            echo "::error::No tracked document was examined. Failing closed rather than reporting a clean tree."
            exit 1
          fi
          if [ ! -s .github/dictionary.txt ]; then
            echo "::error::.github/dictionary.txt is missing or empty. Failing closed rather than judging every word against the general word list alone."
            exit 1
          fi

          # Both files are created empty rather than appended into existence, so
          # a run where the loop never executed is told apart from one where it
          # found nothing, and neither reads a file that is not there.
          : > counts.txt
          : > failures.txt

          # One document at a time, so the report can name the document and the
          # line. Running the speller once over everything concatenated is
          # cheaper and produces a list of words with nowhere to go and look.
          printf '%s\n' "$files" | while IFS= read -r src; do
            # Prose only, and what that means is five removals rather than one,
            # each because the thing removed is not a sentence:
            #
            #   A fenced or indented block is a command or a transcript.
            #   An inline code span is an identifier.
            #   A token carrying a slash, or a dot with a letter after it, is a
            #     path, a URL or a filename. That covers a link target and it
            #     covers a bare one written in the middle of a sentence.
            #   A token carrying a digit is a version, a hash or an issue
            #     reference. `#68` is not a misspelling of anything.
            #   A possessive is grammar rather than spelling. If `commit` is a
            #     word then so is `commit's`, and whether a noun may take one is
            #     the judgement this leg says at the job that it does not make.
            #
            # The apostrophe arrives as a variable because the program below is
            # inside a single-quoted shell word and cannot carry one directly.
            awk -v q="'" '
              FNR == 1 { infence = 0 }
              /^```/ { infence = !infence; next }
              {
                if (infence || $0 ~ /^    /) next
                line = $0
                gsub(/`[^`]*`/, " ", line)
                gsub(/[^ \t]*(\/|\.[A-Za-z])[^ \t]*/, " ", line)
                gsub(q "s", " ", line)
                gsub(/[A-Za-z]*[0-9][A-Za-z0-9]*/, " ", line)
                print line
              }' "$src" > prose.txt
            printf '%s ' "$(wc -w < prose.txt)" >> counts.txt

            # -l prints one unknown word per line and nothing else, so what
            # comes back is words rather than lines of a report.
            hunspell -d en_GB -p .github/dictionary.txt -l prose.txt | sort -u > unknown.txt
            while IFS= read -r word; do
              [ -n "$word" ] || continue
              # Back to the document for the line, so the report points at the
              # place to fix rather than at a word. The first occurrence is
              # enough: a term spelled wrong throughout is one repair. The match
              # is on a whole word, because a substring search sends the reader
              # to the first line carrying those letters inside another word.
              where=$(grep -n -m1 -w -F -- "$word" "$src" | cut -d: -f1 || true)
              if [ -n "$where" ]; then
                echo "FAIL  $src:$where carries \"$word\", which is in no dictionary this project carries"
              else
                echo "FAIL  $src carries \"$word\", which is in no dictionary this project carries"
              fi
              echo x >> failures.txt
            done < unknown.txt
          done

          # The loop above runs in a subshell, so its counters do not survive it
          # and the files it appended to are what does.
          words=$(awk '{ for (i = 1; i <= NF; i++) total += $i } END { print total + 0 }' counts.txt)
          examined=$(printf '%s\n' "$files" | wc -l)
          entries=$(grep -c '' .github/dictionary.txt)
          echo "Examined $words word(s) of prose in $examined tracked document(s), against a project dictionary of $entries entry(s)."
          if [ "$words" -eq 0 ]; then
            echo "::error::No prose was extracted from the tracked documents. Failing closed rather than reporting a clean sweep of nothing."
            exit 1
          fi
          if [ -s failures.txt ]; then
            echo "::error::Word(s) above are in neither the general word list nor .github/dictionary.txt. Fix the spelling, or add the word to the dictionary if this project means it."
            exit 1
          fi
          echo "Every word of prose is in a dictionary this project carries."

  external-links:
    name: External links
    # On a schedule and on request, never on a pull request. An external link
    # check on every pull request makes this repository's gate depend on
    # somebody else's uptime: a change to one document reds because an unrelated
    # site is down for ten minutes, which teaches a contributor to re-run a red
    # check until it passes, and that habit costs more than the dead link.
    # Weekly finds a dead link within a week of it dying, which is soon enough
    # for a link in a document and cheap enough to leave running.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report an external link that no longer resolves
        run: |
          set -euo pipefail
          # Unlike the legs above, zero is a real answer here rather than a
          # broken run: this tree may legitimately carry no external link at
          # all, and it carried none when this workflow landed. The count is
          # printed either way so a run that examined nothing cannot be read as
          # a run that examined everything and found nothing.
          files=$(git ls-files '*.md')
          if [ -z "$files" ]; then
            echo "::error::No tracked document was examined. Failing closed rather than reporting a clean tree."
            exit 1
          fi
          urls=$(printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 awk '
            FNR == 1 { infence = 0 }
            /^```/ { infence = !infence; next }
            {
              if (infence) next
              line = $0
              while (match(line, /\]\(https?:[^)]*\)/)) {
                print substr(line, RSTART + 2, RLENGTH - 3)
                line = substr(line, RSTART + RLENGTH)
              }
            }' | sort -u)
          if [ -z "$urls" ]; then
            echo "Examined 0 external link(s). This tree carries none."
            exit 0
          fi
          fail=0
          count=0
          while IFS= read -r u; do
            count=$((count + 1))
            # A HEAD first, then a GET, because a site refusing HEAD is common
            # and is not a dead link. --max-time bounds a hanging host.
            if curl -sSfL --max-time 20 -o /dev/null -I "$u" 2>/dev/null; then
              continue
            fi
            if curl -sSfL --max-time 20 -o /dev/null "$u" 2>/dev/null; then
              continue
            fi
            echo "FAIL  $u did not resolve"
            fail=1
          done <<< "$urls"
          echo "Examined $count external link(s)."
          if [ "$fail" -ne 0 ]; then
            echo "::error::External link(s) above did not resolve. Repair or remove them; this leg runs on a schedule and does not block a pull request."
            exit 1
          fi
          echo "Every external link resolved."
