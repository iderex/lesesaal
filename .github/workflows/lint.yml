# The formatting, vet and lint check (#22). Formatting arguments are a tax on
# every later review and the only way to stop paying it is to make formatting a
# verdict rather than a preference. Four legs, in the order a reader wants
# them: the formatter reports no difference, the toolchain's own correctness
# analyser is clean, the linter set this project chose is clean, and the rules
# of this project that are plain text facts about the tree hold.
#
# The fourth leg is #94's class and it lands here rather than under a name of
# its own. A new check-run name is a name four documents have to carry and a
# branch protection request has to be re-made, and this leg judges the same
# source the three above it judge. What it adds is the rules a reader of a
# document is currently the only thing holding.
#
# Its check-run name is `Formatting, vet and lint` and that name is part of the
# contract. The branch protection request in docs/required-checks.md quotes
# check-run names literally, so renaming this job silently removes the
# requirement rather than renaming it.
#
# The legs are not written here. Each step calls `go run . ci <leg>`, which is
# the same procedure a contributor runs before pushing, so the tree holds one
# gate and not two. #150 is where that was argued. Installing the linter is
# still a step of this file rather than a leg of the command: the leg reports
# that it could not run rather than putting a program on somebody's machine,
# and on a runner the machine is thrown away afterwards.
#
# Every leg says what it examined and fails closed on an empty selection. A run
# that judged nothing and a run that judged everything and found nothing print
# the same word otherwise, and only one of them is worth a green tick. Every leg
# after the first carries if !cancelled(), so one failing leg cannot hide the
# next and send somebody round the loop twice.
#
# WHAT THIS DELIBERATELY DOES NOT DO, so a green run is not read as more than it
# is:
#
#   It does not format the documents. `*.md` is judged by the doc-hygiene
#   workflow, which refuses trailing whitespace, tabs, a missing final newline
#   and a prose line over 81 columns. That is where the markup half of #22
#   lives, it landed before this file did, and duplicating it here would give
#   the tree two formatters that can disagree.
#
#   IT DOES NOT FORMAT THE CONFIGURATION FILES, AND #22 ASKS FOR THAT. There is
#   no YAML formatter in this tree and this change does not add one. The
#   workflow files here carry more comment than YAML, in a layout chosen so the
#   argument reads in order, and every general purpose YAML formatter reflows or
#   relocates comments. Choosing one is a decision about which of them preserves
#   this layout, and it is not made here. What judges these files today is
#   zizmor for what they are permitted to do and actionlint for nothing, because
#   actionlint is not wired in either. Both gaps are stated rather than closed.
#
#   It does not run tests. #20 owns the unit test check, with its own
#   requirements about display, elevation and network.
#
#   It does not judge whether a suppression is justified. staticcheck.conf says
#   a suppression carries its check identifier and a reason; nothing here reads
#   the reason, and the quality milestone is where that becomes a check.
name: lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting, vet and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Install the toolchain the module declares
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version from go.mod rather than repeating it here, so the
          # module file stays the one place the toolchain version is declared.
          go-version-file: go.mod
          # The dependency set is empty, so there is nothing to cache. #23 is
          # where the dependency graph arrives and where this is revisited.
          cache: false

      - name: Refuse a Go file the formatter would change
        run: go run . ci gofmt

      - name: Refuse a finding from the toolchain's own correctness analyser
        # Always report, so a formatting failure above cannot hide an analyser
        # finding here.
        if: ${{ !cancelled() }}
        run: go run . ci vet

      - name: Install the linter this project pinned
        if: ${{ !cancelled() }}
        # Installed by pinned version rather than by an action, and installed as
        # a program rather than as a requirement of this module: 'go install
        # pkg@version' resolves outside the main module, so go.mod and the empty
        # dependency set the build check guards are untouched. The module
        # proxy's checksum database is what makes the pin mean a fixed set of
        # bytes. GOFLAGS is cleared for this one command because -mod=readonly
        # is a statement about this module and this command is not about this
        # module.
        #
        # Installing is a step and not a leg. The leg below refuses to run
        # rather than to install, because putting a program on somebody's
        # machine is a decision the gate does not take for them.
        run: GOFLAGS= go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Refuse a finding from the linter set this project chose
        if: ${{ !cancelled() }}
        run: go run . ci staticcheck

      - name: Refuse a tree that breaks a rule this project states in prose
        if: ${{ !cancelled() }}
        run: go run . ci invariants
