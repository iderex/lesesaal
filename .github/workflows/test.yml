# The unit test check (#20). Headless testability is a birth requirement of this
# project rather than something retrofitted once the suite is large, so this
# check exists from the first test onwards and states what the suite is allowed
# to have.
#
# Its check-run name is `Unit tests` and that name is part of the contract. The
# branch protection request in docs/required-checks.md quotes check-run names
# literally, so renaming this job silently removes the requirement rather than
# renaming it.
#
# A test that needs a display, a browser, an accelerator, a container runtime or
# a real network is not a unit test in this project. It belongs in one of the
# harnesses under test/, which have their own entry points and their own names,
# and the layout document says so in the place somebody would put one.
#
# EVERY LEG SAYS WHAT IT EXAMINED AND FAILS CLOSED ON AN EMPTY SELECTION. A run
# that selected nothing and a run that ran everything and found no failure print
# the same word otherwise, and only one of them is worth a green tick. Every leg
# after the first carries if !cancelled(), so one failing leg cannot hide the
# next and send somebody round the loop twice.
#
# WHAT THIS DELIBERATELY DOES NOT DO, so a green run is not read as more than it
# is:
#
#   NO LEG HERE REFUSES A SOCKET, AND #20 ASKS FOR A TEST REACHING THE NETWORK
#   TO FAIL. What refuses it is the suite this job runs. harness_test.go reads
#   the source with the toolchain's parser and refuses a call into net or
#   net/http written anywhere but internal/system, so a test that reaches for
#   the network reds this check by name, file and line. That guard landed with
#   #21 and this file does not duplicate it.
#
#   The bound on that is worth having in front of somebody reading a green run.
#   The refusal is over the call that is WRITTEN, so a connection opened through
#   a helper this tree does not own, or by a dependency, is invisible to it. The
#   runner also has a working network and needs one to check out the tree and
#   fetch the toolchain, so nothing sandboxes this job. A suite that reaches the
#   network without writing the call reaches it.
#
#   It does not compile the tree as its own subject. #19 owns `Build`, and a
#   compile failure reds both.
#
#   It does not format, vet or lint. #22 owns those three legs.
#
#   It does not measure coverage or run mutation testing. #92 and the quality
#   milestone own those, and a coverage number reported here would be read as a
#   quality gate this check is not.
#
#   It does not run the harnesses under test/. There are none yet; #52 and #80
#   build them, each with its own check-run name so a run that skipped one says
#   so.
name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # A stock runner image, and no `container:` key on purpose. A container
    # would run this suite as root by default, which is the elevation this check
    # exists to refuse, and it would put the suite in an image nobody in this
    # tree maintains.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Install the toolchain the module declares
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version from go.mod rather than repeating it here, so the
          # module file stays the one place the toolchain version is declared.
          go-version-file: go.mod
          # The dependency set is empty, so there is nothing to cache and a
          # cache step would only add a restore that can fail. #23 is where the
          # dependency graph arrives and where this is revisited.
          cache: false

      - name: Refuse a run that is elevated or has a display
        run: |
          set -euo pipefail
          # These two are the conditions the issue names that a later change
          # could take away without touching a test. Adding `container:` above
          # makes this job root; adding a step that starts a virtual framebuffer
          # gives it a display and lets a browser test hide in the unit suite.
          # Both are refused here rather than trusted to the runner image being
          # what it is today.
          echo "user      $(id -un) (uid $(id -u))"
          echo "display   ${DISPLAY:-<unset>}"
          echo "toolchain $(go version)"
          fail=0
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::This job runs as root. The unit suite runs unprivileged; a test that needs elevation belongs in a harness under test/ with the elevation disclosed."
            fail=1
          fi
          if [ -n "${DISPLAY:-}" ]; then
            echo "::error::A display is available to this job. The unit suite runs with none; a test that needs one belongs in the browser harness, which is #52."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Unprivileged, and no display is reachable from this job."

      - name: Refuse a run that would select no test
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # THIS IS THE LEG THAT MAKES EVERY LATER GREEN MEAN SOMETHING. The
          # toolchain reports a package with no test file as a success, so a
          # change that moves the whole suite somewhere this job does not look
          # leaves the check green and the suite unrun. The selection is counted
          # before anything is executed, and zero fails.
          #
          # -list takes a regular expression and prints the names it would
          # select without running any of them. The package lines it also prints
          # are dropped: a test name is what is being counted.
          packages=$(go list -mod=readonly ./...)
          if [ -z "$packages" ]; then
            echo "::error::No package was examined. Failing closed rather than reporting a suite that selected nothing."
            exit 1
          fi
          #
          # The listing is captured with an explicit guard rather than piped
          # straight into a counter. A pipeline whose failure is swallowed by
          # `|| true` yields the count zero, and this leg would then report a
          # suite that selects nothing when what actually happened is that the
          # toolchain could not answer. Those are different failures and only
          # one of them names the repair.
          if ! listing=$(go test -mod=readonly -list '.*' ./...); then
            echo "::error::The toolchain could not list the tests. Failing closed rather than reading that as a suite of zero."
            exit 1
          fi
          names=$(printf '%s\n' "$listing" | grep -E '^(Test|Example|Fuzz)' || true)
          if [ -z "$names" ]; then
            selected=0
          else
            selected=$(printf '%s\n' "$names" | wc -l)
          fi
          echo "--- the names this job would select ---"
          printf '%s\n' "$names"
          echo "Selected $selected test(s) across $(printf '%s\n' "$packages" | wc -l) package(s)."
          if [ "$selected" -eq 0 ]; then
            echo "::error::The suite selected no test at all. A run that selected nothing is not a run that passed; failing closed."
            exit 1
          fi
          echo "The suite selects $selected test(s)."

      - name: Run the unit suite, and say how many tests ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # -count=1 defeats the result cache, so a green here is a run rather
          # than a memory of one. -failfast stops the package at the first
          # failing test, which is what the issue asks for: the first failure is
          # the one somebody repairs, and the ones after it are frequently
          # consequences of it.
          #
          # The transcript is kept so the count below is derived from what
          # actually ran rather than asserted. pipefail is what makes the
          # toolchain's verdict survive the pipe into tee.
          set -o pipefail
          status=0
          go test -mod=readonly -count=1 -failfast -v ./... 2>&1 | tee test-output.txt || status=$?
          # A COUNT THAT IS NOT A NUMBER IS NOT A COUNT OF ZERO. If the
          # transcript is missing, grep fails, `|| true` leaves the count empty,
          # and `[ "" -eq 0 ]` reports an error rather than a verdict. A non-zero
          # status inside an `if` is a false condition and not an error, so
          # set -e never fires and the leg passes over nothing. The transcript is
          # checked before anything is counted and every count is checked to be a
          # number before it is compared. This shape is the bill of materials
          # workflow's, where the failure was found.
          if [ ! -s test-output.txt ]; then
            echo "::error::There is no transcript to count. Failing closed rather than reporting a suite that ran."
            exit 1
          fi
          require_number() {
            case "$2" in
              ''|*[!0-9]*)
                echo "::error::$1 came out as '$2', which is not a count. Failing closed rather than comparing it."
                exit 1
                ;;
            esac
          }
          # A top-level verdict is at column zero; a subtest's is indented. This
          # counts tests rather than assertions, which is the number the issue
          # asks to be visible.
          ran=$(grep -cE '^--- (PASS|FAIL|SKIP): ' test-output.txt || true)
          passed=$(grep -cE '^--- PASS: ' test-output.txt || true)
          failed=$(grep -cE '^--- FAIL: ' test-output.txt || true)
          skipped=$(grep -cE '^--- SKIP: ' test-output.txt || true)
          require_number "the number of tests executed" "$ran"
          require_number "the number that passed" "$passed"
          require_number "the number that failed" "$failed"
          require_number "the number that were skipped" "$skipped"
          {
            echo "### Unit tests"
            echo
            echo "| tests executed | passed | failed | skipped |"
            echo "| --- | --- | --- | --- |"
            echo "| $ran | $passed | $failed | $skipped |"
            echo
            echo "Toolchain: \`$(go version)\`. Run with \`-count=1 -failfast\`, so a"
            echo "green verdict is a run rather than a cached one, and a package stops at"
            echo "its first failing test."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Executed $ran test(s): $passed passed, $failed failed, $skipped skipped."
          if [ "$status" -ne 0 ]; then
            echo "::error::The unit suite failed. The first failing test is the one to repair; -failfast stopped its package there."
            exit "$status"
          fi
          # The leg above counted the selection before anything ran. If nothing
          # ran anyway, the toolchain reported success over an empty suite and
          # that is not a pass.
          if [ "$ran" -eq 0 ]; then
            echo "::error::The suite reported success and executed no test. Failing closed."
            exit 1
          fi
          echo "Every selected test ran and none failed."
