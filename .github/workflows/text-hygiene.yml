# Line endings and encoding. .gitattributes declares that every tracked text file
# is stored with LF and that the tree is UTF-8; this is what refuses a file that
# is not. The declaration alone changes nothing about bytes already in the
# repository, and a contributor can put anything into a blob with git plumbing,
# so the declaration and the check are two different things and only the second
# one bites.
#
# The legs are not written here. Each step calls `go run . ci <leg>`, which is
# the same procedure a contributor runs before pushing, so the tree holds one
# gate and not two. What each leg reads, and why the line ending is read from
# the index rather than from the checkout, is at the leg in internal/gate.
#
# Each leg says how many files it examined, so a run that covered nothing cannot
# be read as a run that covered everything and found nothing. Both legs always
# report: the second carries if !cancelled() so a failure in the first does not
# hide a second failure.
name: text-hygiene

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: both legs only read the checkout and git.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text:
    name: Line endings and encoding
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Install the toolchain the module declares
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version from go.mod rather than repeating it here, so the
          # module file stays the one place the toolchain version is declared.
          go-version-file: go.mod
          # The dependency set is empty, so there is nothing to cache and a
          # cache step would only add a restore that can fail. #23 is where the
          # dependency graph arrives and where this is revisited.
          cache: false

      - name: Refuse a tracked text file that is not stored with LF
        run: go run . ci line-endings

      - name: Refuse a tracked text file that is not UTF-8
        # Always report, so a line-ending failure above cannot hide an encoding
        # failure here and send somebody round the loop twice.
        if: ${{ !cancelled() }}
        run: go run . ci encoding
