# Line endings and encoding. .gitattributes declares that every tracked text file
# is stored with LF and that the tree is UTF-8; this is what refuses a file that
# is not. The declaration alone changes nothing about bytes already in the
# repository, and a contributor can put anything into a blob with git plumbing,
# so the declaration and the check are two different things and only the second
# one bites.
#
# Both legs read the index rather than the working tree, because a checkout
# filter can hide the very byte the leg is about. Each leg says how many files it
# examined, so a run that covered nothing cannot be read as a run that covered
# everything and found nothing. Both legs always report: the second carries
# if !cancelled() so a failure in the first does not hide a second failure.
name: text-hygiene

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: both legs only read git.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text:
    name: Line endings and encoding
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Refuse a tracked text file that is not stored with LF
        run: |
          set -euo pipefail
          # `git ls-files --eol` reports the line ending of the blob in the index
          # in its first field: i/lf, i/crlf, i/mixed, i/none for a file with no
          # line ending at all, and i/-text for a file git treats as binary. The
          # blob is what a fresh clone on any platform receives, which is the
          # thing being declared.
          tracked=$(git ls-files | wc -l)
          examined=$(git ls-files --eol | awk '$1 != "i/-text"' | wc -l)
          echo "Examined $examined tracked text file(s) of $tracked tracked file(s)."
          if [ "$tracked" -eq 0 ]; then
            echo "::error::No tracked file was examined. Failing closed rather than reporting a clean tree."
            exit 1
          fi
          bad=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed"')
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Tracked text file(s) above are stored with CRLF or with mixed line endings. This tree is stored with LF; see .gitattributes. Re-add them with 'git add --renormalize .'"
            exit 1
          fi
          echo "Every tracked text file is stored with LF."

      - name: Refuse a tracked text file that is not UTF-8
        # Always report, so a line-ending failure above cannot hide an encoding
        # failure here and send somebody round the loop twice.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The declared encoding is UTF-8. `git grep -I --cached -l -e ''` lists
          # every tracked file git does not treat as binary, read from the index.
          # core.quotePath=false keeps a non-ASCII path readable as itself rather
          # than as escapes.
          #
          # git grep exits 0 when it matched, 1 when it did not, and 2 or more on
          # a scanner error. The `|| rc=$?` keeps set -e from aborting on the
          # empty case, and both the error case and the empty case fail: a leg
          # that examined nothing is not a leg that found nothing.
          rc=0
          files=$(git -c core.quotePath=false grep -I --cached -l -e '' -- .) || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::Could not list tracked text files (git grep exit $rc). Failing closed rather than assuming the tree is clean."
            exit 1
          fi
          if [ -z "$files" ]; then
            echo "::error::No tracked text file was examined. Failing closed rather than reporting a clean tree."
            exit 1
          fi
          count=0
          bad=0
          while IFS= read -r f; do
            count=$((count + 1))
            # The blob from the index, not the file on disk, for the same reason
            # as the leg above. iconv from UTF-8 to UTF-8 succeeds only if every
            # byte decodes as UTF-8; ASCII is a subset and passes.
            if git cat-file blob ":$f" | iconv -f UTF-8 -t UTF-8 > /dev/null 2>&1; then
              continue
            fi
            echo "FAIL  $f does not decode as UTF-8"
            bad=1
          done <<< "$files"
          echo "Examined $count tracked text file(s) for UTF-8 validity."
          if [ "$bad" -ne 0 ]; then
            echo "::error::Tracked text file(s) above are not UTF-8. This tree is UTF-8; convert the file rather than adding an exception."
            exit 1
          fi
          echo "Every tracked text file decodes as UTF-8."
