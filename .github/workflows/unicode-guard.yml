# Trojan Source (CVE-2021-42574). Bidirectional overrides, isolates and marks,
# and the zero-width characters, can make source render differently from how it
# executes, hiding logic from a human reviewer. This refuses them in tracked
# text.
#
# The leg is not written here. The step calls `go run . ci unicode`, which is
# the same procedure a contributor runs before pushing, so the tree holds one
# gate and not two. Which characters are refused, and why the byte order mark is
# deliberately not among them, is at the leg in internal/gate.
name: unicode-guard

on:
  # Every branch and every PR: the guard is a cheap read-only scan and must cover
  # every branch a change is made on, not just main.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the guard only reads the tracked tree, it never writes.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a new push / PR update does not
# queue behind an obsolete check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bidi:
    name: Reject Trojan Source Unicode
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Install the toolchain the module declares
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version from go.mod rather than repeating it here, so the
          # module file stays the one place the toolchain version is declared.
          go-version-file: go.mod
          # The dependency set is empty, so there is nothing to cache and a
          # cache step would only add a restore that can fail. #23 is where the
          # dependency graph arrives and where this is revisited.
          cache: false

      - name: Reject bidirectional / invisible Unicode control characters
        run: go run . ci unicode
