# The linter set for this repository (#22). staticcheck reads this file from
# the module root on every run, so a run on a contributor's machine and the run
# in .github/workflows/lint.yml judge the same set by construction. Putting the
# set in a workflow flag instead would leave the two free to drift, and the one
# that drifts is the local run nobody is watching.
#
# WHY THIS TOOL. It is one linter with stable check identifiers rather than an
# aggregator over a dozen whose set moves when its own defaults move. A
# suppression can name the identifier, which is what turns "this warning is
# wrong here" into something a reader can check. The workflow installs it at a
# pinned version rather than adding it to go.mod, so the empty dependency set
# the build check guards stays empty.
#
# NOTHING IS DELIBERATELY EXCLUDED, and that is a decision rather than an
# oversight. `all` is every check the tool carries, which is more than the set
# it enables when this file is absent:
#
#     staticcheck -list-checks | wc -l
#     149
#
# The tree is clean under all of them, measured before this file landed. What
# this file adds over the tool's own default was measured rather than read off a
# list, by running a probe package through staticcheck with this file present
# and with it moved away. Five checks were seen to appear:
#
#   ST1000, ST1020, ST1021 and ST1022 want a package comment, and want the
#   documentation of an exported identifier to begin with its name. They are
#   off by default because they are expensive on a tree that grew without
#   them. This tree has one Go file and it already satisfies all four, so the
#   cheap moment to require them is now rather than after the campaign core
#   arrives.
#
#   ST1003 judges identifier names, and it is the one most likely to be argued
#   with later. It stays on. Where it is wrong the repair is a suppression
#   carrying the check identifier and a reason, which is the shape #22 asks
#   for and which the quality milestone turns into a check of its own.
#
# THOSE FIVE ARE WHAT ONE PROBE SURFACED AND NOT A CLOSED LIST. A probe only
# reports the checks it manages to trip, so this file may be enabling others it
# did not reach, and enumerating the rest here would produce a list that drifts
# against the tool that decides it. Re-run the comparison rather than trusting
# the five.
#
# ONE THING TO KNOW BEFORE WRITING AN EXCLUSION HERE. A wildcard naming a
# family this tool does not have is accepted in silence rather than refused:
#
#     staticcheck -checks 'all,-ZZ*' ./... ; echo $?
#     0
#
# So an exclusion is worth nothing until its identifier has been checked
# against -list-checks. A typo leaves the check enabled and leaves a comment
# behind saying it is not.
checks = ["all"]
